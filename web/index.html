<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sherpa ASR 语音转文字</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="page-head">
        <h1>本地语音转文字</h1>
        <p class="subtitle">sherpa-onnx 离线识别，纯本地 CPU 推理</p>
    </header>

    <main class="container">
        <section class="card" aria-label="转写控制台">
            <div class="tool-row">
                <label class="field-label" for="modelSelect">模型选择</label>
                <select id="modelSelect" class="select" disabled>
                    <option>正在加载模型列表...</option>
                </select>
                <span id="modelStatus" class="status-text"></span>
            </div>

            <div class="tool-row is-hidden" id="punctRow">
                <label class="check-label" for="usePunct">
                    <input type="checkbox" id="usePunct" checked>
                    <span>添加标点（中/英）</span>
                </label>
                <span class="status-text">标点模型就绪</span>
            </div>

            <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="选择或拖拽音频文件">
                <div class="dropzone-icon" aria-hidden="true">🎙</div>
                <div class="dropzone-text">点击选择或拖拽音频文件到此处</div>
                <div class="dropzone-hint">支持 MP3 / WAV / M4A / AAC / FLAC / OGG 等格式</div>
                <input type="file" id="fileInput" accept="audio/*">
            </div>

            <div class="file-info is-hidden" id="fileInfo">
                <span class="file-name-wrap">
                    <span id="fileName" class="file-name"></span>
                    <span id="fileState" class="file-state is-hidden" aria-live="polite"></span>
                </span>
                <span id="fileMeta" class="file-meta"></span>
            </div>

            <div class="progress-row is-hidden" id="progressRow">
                <div class="progress-track" aria-hidden="true">
                    <div id="progressBar" class="progress-bar"></div>
                </div>
                <span id="progressText" class="progress-text">正在上传 0%</span>
            </div>

            <button id="transcribeBtn" class="primary-btn" disabled>开始转写</button>
        </section>

        <section class="card is-hidden" id="resultCard" aria-label="识别结果">
            <div class="result-header">
                <span class="result-title">识别结果</span>
                <div class="result-meta">
                    <span class="tag" id="modelTag"></span>
                    <span class="tag" id="timeCost"></span>
                    <button class="copy-btn" id="copyBtn" type="button">复制文本</button>
                </div>
            </div>
            <textarea class="result-box" id="resultText" readonly placeholder="等待处理..."></textarea>
        </section>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
