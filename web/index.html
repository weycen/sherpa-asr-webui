<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sherpa ASR 语音转文字</title>
    <link rel="stylesheet" href="/css/style.css?v=16">
</head>
<body>
    <div id="toast" class="toast is-hidden" role="status" aria-live="polite"></div>
    <header class="page-head">
        <h1>本地语音转文字</h1>
        <p class="subtitle">sherpa-onnx 离线识别，纯本地 CPU 推理</p>
    </header>

    <main class="container">
        <section class="card card-compact" aria-label="模型设置">
            <div class="tool-row">
                <label class="field-label" for="modelSelect">语音模型</label>
                <select id="modelSelect" class="select" disabled>
                    <option>正在加载模型列表...</option>
                </select>
                <span id="modelStatus" class="status-text"></span>
            </div>

            <div class="tool-row">
                <label class="field-label" for="punctSelect">标点模型</label>
                <select id="punctSelect" class="select" disabled>
                    <option>正在加载标点模型...</option>
                </select>
            </div>
        </section>

        <section class="card" aria-label="转写控制台">
            <div class="source-tabs" role="tablist">
                <button type="button" class="source-tab active" id="tabUpload" role="tab" aria-selected="true">📁 上传本地文件</button>
                <button type="button" class="source-tab" id="tabUrl" role="tab" aria-selected="false">🌐 通过链接下载</button>
            </div>

            <div class="tab-panel" id="panelUpload">
                <div class="dropzone is-compact" id="dropzone" role="button" tabindex="0" aria-label="选择或拖拽音频文件">
                    <div class="dropzone-icon" aria-hidden="true">🎙</div>
                    <div class="dropzone-text">点击选择或拖拽音频文件到此处</div>
                    <div class="dropzone-hint">支持 MP3 / WAV / M4A / AAC / FLAC / OGG / OPUS / WMA / AMR / AIFF / WEBM 音频</div>
                    <input type="file" id="fileInput"
                           accept=".mp3,.wav,.m4a,.aac,.flac,.ogg,.opus,.wma,.amr,.aif,.aiff,.webm,audio/*">
                </div>
            </div>

            <div class="tab-panel is-hidden" id="panelUrl">
                <div class="url-input-wrap">
                    <div class="url-input-row">
                        <input type="url" id="urlInput" class="url-input" placeholder="输入 YouTube / B站等视频或音频链接 (https://...)" autocomplete="off">
                        <button type="button" id="urlFetchBtn" class="url-fetch-btn">解析并下载</button>
                    </div>
                    <div class="url-download-box is-hidden" id="urlDownloadBox">
                        <div class="url-download-header">
                            <span class="url-download-title" id="urlDownloadTitle">准备就绪</span>
                            <button type="button" class="url-cancel-btn" id="urlCancelBtn">取消</button>
                        </div>
                        <div class="url-progress-bar-bg">
                            <div class="url-progress-bar-fill" id="urlProgressBarFill"></div>
                        </div>
                        <div class="url-download-status">
                            <span id="urlDownloadPercent">0%</span>
                            <span id="urlDownloadSpeed"></span>
                            <span id="urlDownloadEta"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="file-upload-row is-hidden" id="fileUploadRow">
                <div class="file-info" id="fileInfo">
                    <div class="file-info-bar" id="uploadProgressBar" aria-hidden="true"></div>
                    <span class="file-name-wrap">
                        <span id="fileName" class="file-name"></span>
                    </span>
                    <span id="fileMeta" class="file-meta"></span>
                    <span id="uploadProgressText" class="file-progress-text is-hidden"></span>
                    <span id="fileState" class="file-state" aria-live="polite"></span>
                </div>
            </div>

            <div class="audio-player-wrap is-hidden" id="audioPlayerWrap">
                <audio id="audioPlayer" class="audio-player" controls preload="metadata"></audio>
            </div>

            <button id="transcribeBtn" class="primary-btn" disabled>开始转写</button>
        </section>

        <section class="card is-hidden" id="resultCard" aria-label="识别结果">
            <div class="result-header">
                <div class="result-title-wrap">
                    <span class="result-title">识别结果</span>
                    <div class="view-toggle" id="viewToggle">
                        <button type="button" class="toggle-btn active" id="textViewBtn">全文</button>
                        <button type="button" class="toggle-btn" id="segmentsViewBtn">时间轴</button>
                    </div>
                </div>
                <div class="result-meta">
                    <span class="tag is-hidden" id="progressTag" aria-live="polite"></span>
                    <span class="tag is-hidden" id="timeCost"></span>
                    <span class="tag is-hidden" id="statTag"></span>
                    <button class="copy-btn" id="copyBtn" type="button" disabled>复制文本</button>
                    <div class="export-group" role="group" aria-label="导出文件">
                        <button class="export-btn" id="exportBtn" type="button" disabled>导出 TXT</button>
                        <button class="export-btn" id="exportSrtBtn" type="button" disabled>导出 SRT</button>
                        <button class="export-btn" id="exportVttBtn" type="button" disabled>导出 VTT</button>
                    </div>
                </div>
            </div>
            <textarea class="result-box" id="resultText" readonly placeholder="等待处理..."></textarea>
            <div class="segments-box is-hidden" id="segmentsBox"></div>
        </section>
    </main>

    <script src="/js/app.js?v=17"></script>
</body>
</html>
